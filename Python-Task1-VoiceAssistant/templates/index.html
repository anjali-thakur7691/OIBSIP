<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis | Voice Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="app-shell">
    <header><span class="eyebrow">PYTHON • FLASK • WEB SPEECH API</span><h1>JARVIS</h1><p>Your personal voice assistant</p></header>
    <section class="assistant-card" aria-live="polite">
      <div class="orb" id="orb"><span>✦</span></div><p class="status" id="status">Ready to listen</p>
      <button id="micButton" class="mic" type="button"><span>🎙</span> Start listening</button>
      <form id="commandForm" class="command-form"><label for="commandInput">Or type a command</label><div><input id="commandInput" placeholder="Try: what's the time?" autocomplete="off"><button type="submit">Send</button></div></form>
      <div class="conversation"><article><small>YOU SAID</small><p id="command">Waiting for a command…</p></article><article class="answer"><small>JARVIS</small><p id="response">Hello! Press the microphone and speak.</p></article></div>
    </section>
    <section class="quick"><button data-command="what is the time">Time</button><button data-command="what is the date">Date</button><button data-command="open youtube">YouTube</button><button data-command="weather in Balaghat">Weather</button><button data-command="show history">History</button></section>
    <section id="historyPanel" class="history hidden"><div><h2>Recent commands</h2><button id="clearHistory" class="text-button">Clear</button></div><ol id="historyList"></ol></section>
    <p class="privacy">Privacy: voice recognition happens in your browser. Only text commands are saved locally.</p>
  </main><script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
